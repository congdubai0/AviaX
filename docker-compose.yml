services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aviax}
      POSTGRES_USER: ${POSTGRES_USER:-aviax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aviax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aviax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aviax}?schema=public
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME in .env}
      MINI_APP_SHORT_NAME: ${MINI_APP_SHORT_NAME:-app}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:?Set BOT_WEBHOOK_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-86400}
      REDIRECT_SIGNING_SECRET: ${REDIRECT_SIGNING_SECRET:?Set REDIRECT_SIGNING_SECRET in .env}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set IP_HASH_SECRET in .env}
      ADMIN_SECRET: ${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_CHANNEL_URL: ${TELEGRAM_CHANNEL_URL:-https://t.me/}
      FANPAGE_URL: ${FANPAGE_URL:-}
      AVIAX_TARGET_URL: ${AVIAX_TARGET_URL:-https://microgaming.io/game/aviax/}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  aviax_postgres_data:
