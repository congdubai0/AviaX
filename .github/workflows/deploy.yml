name: Deploy AviaX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for existing domain tests
        run: npm run db:generate

      - name: Run tests
        run: npm test -- --run

      - name: Set up Deno for Edge Function type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: >-
          deno check
          supabase/functions/auth/index.ts
          supabase/functions/missions/index.ts
          supabase/functions/mission-start/index.ts
          supabase/functions/mission-complete/index.ts
          supabase/functions/check-channel/index.ts
          supabase/functions/go/index.ts
          supabase/functions/daily-flight/index.ts
          supabase/functions/leaderboard/index.ts
          supabase/functions/referral/index.ts
          supabase/functions/admin/index.ts

      - name: Check public Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Build static Mini App
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
